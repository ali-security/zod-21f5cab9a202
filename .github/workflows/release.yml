# .github/release.yml

name: Release on npm
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional vitest filter; empty runs the full suite"
        required: false
        default: ""

env:
  NO_COLOR: "1"

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        
      - name: Install dependencies
        run: |
          pnpm install

      - name: Build and test
        working-directory: ./packages/zod
        run: |
          pnpm run test ${{ inputs.test-filter }}
          pnpm build
          
      - name: Pack
        working-directory: ./packages/zod
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: zod-tgz
          path: packages/zod/zod-*.tgz
          if-no-files-found: error
